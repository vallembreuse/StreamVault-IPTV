name: NAS Lot 1 TEST APK

on:
  push:
    branches:
      - build/nas-lot1-test

permissions:
  contents: read

jobs:
  build-test-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build TEST APK
        run: ./gradlew --console=plain :app:assembleDebug

      - name: Prepare artifact
        shell: bash
        run: |
          mkdir -p dist
          APK_PATH=$(find app/build/outputs/apk/debug -type f -name '*.apk' | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "No debug APK produced."
            exit 1
          fi
          cp "$APK_PATH" dist/StreamVault-nas-lot1-test.apk

      - name: Upload TEST APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: nas-lot1-test-apk
          path: dist/StreamVault-nas-lot1-test.apk
