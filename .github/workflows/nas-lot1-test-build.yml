name: NAS Lot 1 TEST APK

on:
  push:
    branches:
      - build/nas-lot1-test

permissions:
  contents: read

jobs:
  build-test-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build TEST APK
        shell: bash
        run: |
          set +e
          ./gradlew --console=plain :app:assembleDebug > gradle-build.log 2>&1
          code=$?
          if [ "$code" -ne 0 ]; then
            echo "=== COMPACT GRADLE FAILURE ==="
            grep -E -C 2 '(^e: |error:|FAILURE:|What went wrong|FAILED|Compilation error|Unresolved reference|Type mismatch|Cannot access|Exception)' gradle-build.log | tail -n 180 || true
            echo "=== LAST 80 LINES ==="
            tail -n 80 gradle-build.log
            exit "$code"
          fi
          tail -n 40 gradle-build.log

      - name: Prepare artifact
        shell: bash
        run: |
          mkdir -p dist
          APK_PATH=$(find app/build/outputs/apk/debug -type f -name '*.apk' | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "No debug APK produced."
            exit 1
          fi
          cp "$APK_PATH" dist/StreamVault-nas-lot1-test.apk

      - name: Upload TEST APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: nas-lot1-test-apk
          path: dist/StreamVault-nas-lot1-test.apk
