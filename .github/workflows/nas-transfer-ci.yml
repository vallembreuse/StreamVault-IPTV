name: NAS Transfer Feature CI

on:
  push:
    branches:
      - feature/nas-transfer-v1
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Compile, test, and lint
        run: ./gradlew --console=plain :app:assembleDebug testDebugUnitTest :app:lintDebug :data:lintDebug
