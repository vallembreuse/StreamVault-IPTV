name: Apply watched detail actions

on:
  push:
    branches:
      - feat/watch-progress-cards
    paths:
      - .github/workflows/watch-progress-detail-actions.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/watch-progress-cards
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: gradle/actions/setup-gradle@v4
      - name: Apply changes
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          # 1) Move the watched badge on movie cards to the top-right.
          p = Path('app/src/main/java/com/streamvault/app/ui/components/shell/AppMediaCards.kt')
          text = p.read_text()
          old = '''modifier = Modifier
                    .align(Alignment.BottomEnd)
                    .padding(end = 8.dp, bottom = 8.dp)'''
          new = '''modifier = Modifier
                    .align(Alignment.TopEnd)
                    .padding(end = 8.dp, top = 8.dp)'''
          if text.count(old) != 1:
              raise SystemExit(f'Expected exactly one movie watched badge block, found {text.count(old)}')
          p.write_text(text.replace(old, new, 1))

          # 2) Add a watched/unwatched action to the movie detail state and repository logic.
          p = Path('app/src/main/java/com/streamvault/app/ui/screens/movies/MovieDetailViewModel.kt')
          text = p.read_text()
          old = 'import com.streamvault.domain.model.Movie\nimport com.streamvault.domain.model.Result\n'
          new = 'import com.streamvault.domain.model.Movie\nimport com.streamvault.domain.model.PlaybackHistory\nimport com.streamvault.domain.model.PlaybackWatchedStatus\nimport com.streamvault.domain.model.Result\n'
          if text.count(old) != 1:
              raise SystemExit('MovieDetailViewModel import anchor not found exactly once')
          text = text.replace(old, new, 1)

          anchor = '''    fun toggleFavorite() {
        val movie = _uiState.value.movie ?: return
        viewModelScope.launch {
            val newState = !movie.isFavorite
            if (newState) {
                favoriteRepository.addFavorite(movie.providerId, movie.id, ContentType.MOVIE)
            } else {
                favoriteRepository.removeFavorite(movie.providerId, movie.id, ContentType.MOVIE)
            }
            _uiState.update { it.copy(movie = movie.copy(isFavorite = newState)) }
        }
    }
'''
          addition = anchor + '''
    fun toggleWatched() {
        val movie = _uiState.value.movie ?: return
        viewModelScope.launch {
            val currentlyWatched = _uiState.value.isWatched
            val totalDurationMs = movie.durationSeconds.takeIf { it > 0 }?.times(1000L) ?: 0L
            val result = if (currentlyWatched) {
                playbackHistoryRepository.removeFromHistory(
                    contentId = movie.id,
                    contentType = ContentType.MOVIE,
                    providerId = movie.providerId
                )
            } else {
                val existing = playbackHistoryRepository.getPlaybackHistory(
                    contentId = movie.id,
                    contentType = ContentType.MOVIE,
                    providerId = movie.providerId
                )
                val history = existing ?: PlaybackHistory(
                    contentId = movie.id,
                    contentType = ContentType.MOVIE,
                    providerId = movie.providerId,
                    title = movie.name,
                    posterUrl = movie.posterUrl,
                    streamUrl = movie.streamUrl,
                    resumePositionMs = movie.watchProgress,
                    totalDurationMs = totalDurationMs,
                    lastWatchedAt = System.currentTimeMillis()
                )
                playbackHistoryRepository.markAsWatched(history)
            }

            if (result is Result.Success) {
                val updatedProgress = if (currentlyWatched) 0L else totalDurationMs
                _uiState.update { state ->
                    state.copy(
                        movie = state.movie?.copy(watchProgress = updatedProgress),
                        isWatched = !currentlyWatched,
                        hasResume = false,
                        resumePositionMs = 0L
                    )
                }
            }
        }
    }
'''
          if text.count(anchor) != 1:
              raise SystemExit('toggleFavorite anchor not found exactly once')
          text = text.replace(anchor, addition, 1)

          old = '''        val resumePositionMs = playbackHistory?.resumePositionMs ?: movie.watchProgress
        val hasResume = resumePositionMs > 5000L && !isPlaybackComplete(
            progressMs = resumePositionMs,
            totalDurationMs = playbackHistory?.totalDurationMs?.takeIf { it > 0L } ?: movieDurationMs
        )
'''
          new = '''        val resumePositionMs = playbackHistory?.resumePositionMs ?: movie.watchProgress
        val resolvedDurationMs = playbackHistory?.totalDurationMs?.takeIf { it > 0L } ?: movieDurationMs
        val isWatched = playbackHistory?.watchedStatus == PlaybackWatchedStatus.COMPLETED_MANUAL ||
            playbackHistory?.watchedStatus == PlaybackWatchedStatus.COMPLETED_AUTO ||
            isPlaybackComplete(progressMs = resumePositionMs, totalDurationMs = resolvedDurationMs)
        val hasResume = !isWatched && resumePositionMs > 5000L && !isPlaybackComplete(
            progressMs = resumePositionMs,
            totalDurationMs = resolvedDurationMs
        )
'''
          if text.count(old) != 1:
              raise SystemExit('applyLoadedMovie progress block not found exactly once')
          text = text.replace(old, new, 1)

          old = '''                hasResume = hasResume,
                resumePositionMs = if (hasResume) resumePositionMs else 0L
'''
          new = '''                hasResume = hasResume,
                resumePositionMs = if (hasResume) resumePositionMs else 0L,
                isWatched = isWatched
'''
          if text.count(old) != 1:
              raise SystemExit('MovieDetailUiState update anchor not found exactly once')
          text = text.replace(old, new, 1)

          old = '''    val hasResume: Boolean = false,
    val resumePositionMs: Long = 0L,
    val isCasting: Boolean = false,
'''
          new = '''    val hasResume: Boolean = false,
    val resumePositionMs: Long = 0L,
    val isWatched: Boolean = false,
    val isCasting: Boolean = false,
'''
          if text.count(old) != 1:
              raise SystemExit('MovieDetailUiState declaration anchor not found exactly once')
          p.write_text(text.replace(old, new, 1))

          # 3) Wire the action into the movie detail screen.
          p = Path('app/src/main/java/com/streamvault/app/ui/screens/movies/MovieDetailScreen.kt')
          text = p.read_text()
          old = '''                hasResume = uiState.hasResume,
                resumePositionMs = uiState.resumePositionMs,
                isCasting = uiState.isCasting,
'''
          new = '''                hasResume = uiState.hasResume,
                resumePositionMs = uiState.resumePositionMs,
                isWatched = uiState.isWatched,
                isCasting = uiState.isCasting,
'''
          if text.count(old) != 1:
              raise SystemExit('MovieDetailContent call state anchor not found exactly once')
          text = text.replace(old, new, 1)

          old = '''                onCast = viewModel::castMovie,
                onToggleFavorite = viewModel::toggleFavorite,
                onSelectVariant = viewModel::selectMovieVariant,
'''
          new = '''                onCast = viewModel::castMovie,
                onToggleFavorite = viewModel::toggleFavorite,
                onToggleWatched = viewModel::toggleWatched,
                onSelectVariant = viewModel::selectMovieVariant,
'''
          if text.count(old) != 1:
              raise SystemExit('MovieDetailContent action anchor not found exactly once')
          text = text.replace(old, new, 1)

          old = '''    hasResume: Boolean,
    resumePositionMs: Long,
    isCasting: Boolean,
'''
          new = '''    hasResume: Boolean,
    resumePositionMs: Long,
    isWatched: Boolean,
    isCasting: Boolean,
'''
          if text.count(old) != 1:
              raise SystemExit('MovieDetailContent params anchor not found exactly once')
          text = text.replace(old, new, 1)

          old = '''    onCast: () -> Unit,
    onToggleFavorite: () -> Unit,
    onSelectVariant: (Long) -> Unit,
'''
          new = '''    onCast: () -> Unit,
    onToggleFavorite: () -> Unit,
    onToggleWatched: () -> Unit,
    onSelectVariant: (Long) -> Unit,
'''
          if text.count(old) != 1:
              raise SystemExit('MovieDetailContent action params anchor not found exactly once')
          text = text.replace(old, new, 1)

          # Two MovieDetailHeroText calls (compact + wide).
          old = '''                            hasResume = hasResume,
                            resumePositionMs = resumePositionMs,
                            isCasting = isCasting,
'''
          new = '''                            hasResume = hasResume,
                            resumePositionMs = resumePositionMs,
                            isWatched = isWatched,
                            isCasting = isCasting,
'''
          if text.count(old) != 2:
              raise SystemExit(f'Expected two hero state call anchors, found {text.count(old)}')
          text = text.replace(old, new)

          old = '''                            onCast = onCast,
                            onToggleFavorite = onToggleFavorite,
                            onSelectVariant = onSelectVariant,
'''
          new = '''                            onCast = onCast,
                            onToggleFavorite = onToggleFavorite,
                            onToggleWatched = onToggleWatched,
                            onSelectVariant = onSelectVariant,
'''
          if text.count(old) != 2:
              raise SystemExit(f'Expected two hero action call anchors, found {text.count(old)}')
          text = text.replace(old, new)

          old = '''    hasResume: Boolean,
    resumePositionMs: Long,
    isCasting: Boolean,
    externalRatings: ExternalRatings,
'''
          new = '''    hasResume: Boolean,
    resumePositionMs: Long,
    isWatched: Boolean,
    isCasting: Boolean,
    externalRatings: ExternalRatings,
'''
          if text.count(old) != 1:
              raise SystemExit('MovieDetailHeroText state params anchor not found exactly once')
          text = text.replace(old, new, 1)

          old = '''    onCast: () -> Unit,
    onToggleFavorite: () -> Unit,
    onSelectVariant: (Long) -> Unit,
    playButtonFocusRequester: FocusRequester,
'''
          new = '''    onCast: () -> Unit,
    onToggleFavorite: () -> Unit,
    onToggleWatched: () -> Unit,
    onSelectVariant: (Long) -> Unit,
    playButtonFocusRequester: FocusRequester,
'''
          if text.count(old) != 1:
              raise SystemExit('MovieDetailHeroText action params anchor not found exactly once')
          text = text.replace(old, new, 1)

          old = '''            if (hasTrailer) {
                TvButton(
                    onClick = onPlayTrailer,
                    colors = ButtonDefaults.colors(
                        containerColor = AppColors.SurfaceEmphasis,
                        contentColor = AppColors.TextPrimary
                    )
                ) {
                    Text(stringResource(R.string.movie_detail_trailer))
                }
            }
            TvIconButton(
'''
          new = '''            if (hasTrailer) {
                TvButton(
                    onClick = onPlayTrailer,
                    colors = ButtonDefaults.colors(
                        containerColor = AppColors.SurfaceEmphasis,
                        contentColor = AppColors.TextPrimary
                    )
                ) {
                    Text(stringResource(R.string.movie_detail_trailer))
                }
            }
            TvButton(
                onClick = onToggleWatched,
                colors = ButtonDefaults.colors(
                    containerColor = if (isWatched) AppColors.Brand else AppColors.SurfaceEmphasis,
                    contentColor = if (isWatched) Color.White else AppColors.TextPrimary
                )
            ) {
                Text(if (isWatched) "↶ Non vu" else "✓ Vu")
            }
            TvIconButton(
'''
          if text.count(old) != 1:
              raise SystemExit('Movie detail watched button insertion anchor not found exactly once')
          p.write_text(text.replace(old, new, 1))
          PY
      - name: Compile debug app
        run: ./gradlew --console=plain :app:compileDebugKotlin
      - name: Commit changes
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/streamvault/app/ui/components/shell/AppMediaCards.kt \
                  app/src/main/java/com/streamvault/app/ui/screens/movies/MovieDetailScreen.kt \
                  app/src/main/java/com/streamvault/app/ui/screens/movies/MovieDetailViewModel.kt
          git commit -m "feat(vod): add watched toggle to movie detail"
          git push origin HEAD:feat/watch-progress-cards
