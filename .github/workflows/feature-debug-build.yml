name: Feature Debug APK

on:
  push:
    branches:
      - feat/watch-progress-cards

permissions:
  contents: read

jobs:
  build-debug:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install stable debug signing key
        run: |
          mkdir -p "$HOME/.android"
          base64 --decode .ci/streamvault-custom-debug.jks.b64 > "$HOME/.android/debug.keystore"

      - name: Apply immediate watched-state refresh
        run: python3 .ci/apply_watch_return_refresh.py

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew --console=plain :app:assembleDebug

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: watch-progress-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
