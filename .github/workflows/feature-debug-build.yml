name: Feature Debug APK

on:
  push:
    branches:
      - feat/watch-progress-cards
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-debug:
    runs-on: ubuntu-latest
    env:
      EXPECTED_SIGNING_SHA256: 11C98FBE9C83A097E88A8649B6DC9EC1EE86BC73EA1AF097BE8055B937884571
      STREAMVAULT_DEBUG_KEYSTORE_B64: ${{ secrets.STREAMVAULT_DEBUG_KEYSTORE_B64 }}
      STREAMVAULT_DEBUG_STORE_PASSWORD: ${{ secrets.STREAMVAULT_DEBUG_STORE_PASSWORD }}
      STREAMVAULT_DEBUG_KEY_ALIAS: ${{ secrets.STREAMVAULT_DEBUG_KEY_ALIAS }}
      STREAMVAULT_DEBUG_KEY_PASSWORD: ${{ secrets.STREAMVAULT_DEBUG_KEY_PASSWORD }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: temurin
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Validate signing secrets
        shell: bash
        run: |
          set -euo pipefail
          for name in \
            STREAMVAULT_DEBUG_KEYSTORE_B64 \
            STREAMVAULT_DEBUG_STORE_PASSWORD \
            STREAMVAULT_DEBUG_KEY_ALIAS \
            STREAMVAULT_DEBUG_KEY_PASSWORD
          do
            if [ -z "${!name:-}" ]; then
              echo "Missing required GitHub Actions secret: $name" >&2
              exit 1
            fi
          done

      - name: Install stable debug signing key
        shell: bash
        run: |
          set -euo pipefail
          src="$RUNNER_TEMP/streamvault-custom.jks"
          cert="$RUNNER_TEMP/streamvault-signing-cert.pem"
          mkdir -p "$HOME/.android"
          printf '%s' "$STREAMVAULT_DEBUG_KEYSTORE_B64" | base64 --decode > "$src"
          chmod 600 "$src"

          keytool -exportcert -rfc \
            -keystore "$src" \
            -storepass "$STREAMVAULT_DEBUG_STORE_PASSWORD" \
            -alias "$STREAMVAULT_DEBUG_KEY_ALIAS" \
            -file "$cert"

          actual="$(openssl x509 -in "$cert" -noout -fingerprint -sha256 \
            | cut -d= -f2 \
            | tr -d ':[:space:]' \
            | tr '[:lower:]' '[:upper:]')"

          if [ "$actual" != "$EXPECTED_SIGNING_SHA256" ]; then
            echo "Signing keystore certificate mismatch." >&2
            echo "Expected: $EXPECTED_SIGNING_SHA256" >&2
            echo "Actual:   $actual" >&2
            exit 1
          fi

          echo "Verified source keystore certificate: $actual"

          rm -f "$HOME/.android/debug.keystore"
          keytool -importkeystore -noprompt \
            -srckeystore "$src" \
            -srcstorepass "$STREAMVAULT_DEBUG_STORE_PASSWORD" \
            -srcalias "$STREAMVAULT_DEBUG_KEY_ALIAS" \
            -srckeypass "$STREAMVAULT_DEBUG_KEY_PASSWORD" \
            -destkeystore "$HOME/.android/debug.keystore" \
            -deststoretype PKCS12 \
            -deststorepass android \
            -destkeypass android \
            -destalias androiddebugkey
          chmod 600 "$HOME/.android/debug.keystore"

      - name: Apply immediate watched-state refresh
        run: python3 .ci/apply_watch_return_refresh.py

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew --console=plain :app:assembleDebug

      - name: Verify APK signing certificate
        shell: bash
        run: |
          set -euo pipefail
          apk="$(find app/build/outputs/apk/debug -maxdepth 1 -name '*.apk' -type f | head -n 1)"
          if [ -z "$apk" ]; then
            echo "No debug APK found." >&2
            exit 1
          fi

          apksigner="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          if [ -z "$apksigner" ]; then
            echo "apksigner not found in Android SDK build-tools." >&2
            exit 1
          fi

          actual="$($apksigner verify --print-certs "$apk" \
            | awk -F': ' '/Signer #1 certificate SHA-256 digest:/{print $2; exit}' \
            | tr -d ':[:space:]' | tr '[:lower:]' '[:upper:]')"

          if [ "$actual" != "$EXPECTED_SIGNING_SHA256" ]; then
            echo "Built APK certificate mismatch." >&2
            echo "Expected: $EXPECTED_SIGNING_SHA256" >&2
            echo "Actual:   $actual" >&2
            exit 1
          fi

          echo "Verified stable APK signing certificate: $actual"
          sha256sum "$apk"

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: watch-progress-debug-apk-${{ github.sha }}
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
